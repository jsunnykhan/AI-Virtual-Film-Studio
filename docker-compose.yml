services:
  studio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-movie-studio-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://studio:studio@postgres:5432/ai_movie_studio
      - FFMPEG_BIN=ffmpeg
      # - COMFYUI_BASE_URL=${COMFYUI_BASE_URL:-http://host.docker.internal:8188} # Commented out: pending ComfyUI URL
      - AUTONOMOUS_STUDIO_ENABLED=true
    volumes:
      - .:/app
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-movie-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_movie_studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d ai_movie_studio"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-movie-studio-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ai-movie-studio.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-studio}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
