services:
  postgres:
    image: pgvector/pgvector:pg17

    container_name: ai-movie-studio-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_movie_studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest

    container_name: ai-movie-studio-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ai-movie-studio.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-studio}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
